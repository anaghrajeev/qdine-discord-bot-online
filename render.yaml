services:
  - type: web
    name: qdine-discord-bot
    env: docker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WORKING_CHANNEL_ID
        sync: false
      - key: BREAK_CHANNEL_ID
        sync: false
      - key: REPORT_CHANNEL_ID
        sync: false
      - key: ADMIN_CATEGORY_ID
        sync: false
      - key: ADMIN_ROLE_ID
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DAILY_REPORT_TIME
        value: 18:00
      - key: WEEKLY_REPORT_DAY
        value: FRIDAY
      - key: WEEKLY_REPORT_TIME
        value: 18:00
